services:
  # Veritabanı Servisi (Dış dünyaya tamamen kapatıldı)
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend (FastAPI) Servisi
  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db

  # Frontend (React) Servisi
  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - backend

# Veritabanı verilerinin kaybolmaması için gereken kalıcı disk alanı
volumes:
  postgres_data:
